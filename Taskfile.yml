version: "3"

silent: true

# Conventions:
#
# - Every task has a `desc`, and `task` on its own lists them all.
# - The same few names in every project: doctor, init, dev, check, fix, test, build, ci.
# - `check` never changes a file. `fix` is the one that does.
# - `ci` runs exactly what must pass before work is handed over.
# - Related tasks share a prefix and a colon, such as `db:migrate` and `db:reset`.
# - Extra arguments go after `--` and reach the command through {{.CLI_ARGS}}.
# - A task that changes stored data only reports what it would do.
#   Adding `-- --apply` makes it write.
# - A task that needs a tool checks for it first and says how to install it.
# - Tasks are a thin layer over the project's own commands, which stay the source of truth.
# - When this file grows long, groups move into `tasks/<Group>.yml` and are included here.
#
# Only tasks that work today are defined. Add the others when there is
# something real for them to run.

# Shared checks, reused below with `*needs-bun` and `*needs-install`.
x-needs-bun: &needs-bun
  sh: command -v bun >/dev/null 2>&1
  msg: "Bun is missing. Install it from https://bun.com, then run `task init`."
x-needs-install: &needs-install
  sh: test -d node_modules
  msg: "Nothing is installed yet. Run `task init` first."

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  doctor:
    desc: Check the tools this project needs, without changing anything
    cmd: |
      missing=0
      for tool in git bun; do
        if command -v "$tool" >/dev/null 2>&1; then
          printf '%-5s %s\n' "$tool" "$("$tool" --version | head -n 1)"
        else
          printf '%-5s missing\n' "$tool"
          missing=1
        fi
      done
      expected=$(sed -n 's/.*"packageManager": "bun@\([^"]*\)".*/\1/p' package.json)
      if command -v bun >/dev/null 2>&1 && [ "$(bun --version)" != "$expected" ]; then
        printf 'Bun %s is installed, but this project is fixed to %s.\n' "$(bun --version)" "$expected"
        missing=1
      fi
      exit $missing

  init:
    desc: Install everything, exactly as recorded in the lockfile
    preconditions: [*needs-bun]
    cmd: bun install --frozen-lockfile

  dev:
    desc: Serve the tool on this machine at http://127.0.0.1:4100
    preconditions: [*needs-bun, *needs-install]
    cmd: bun run dev

  check:
    desc: Check formatting, lint rules and types, without changing anything
    preconditions: [*needs-bun, *needs-install]
    cmd: bun run check

  fix:
    desc: Format the code and apply the fixes the checks know how to make
    preconditions: [*needs-bun, *needs-install]
    cmd: bun run fix

  test:
    desc: Run the tests once
    preconditions: [*needs-bun, *needs-install]
    cmd: bun run test {{.CLI_ARGS}}

  build:
    desc: Build the tool for running without the development server
    preconditions: [*needs-bun, *needs-install]
    cmd: bun run build

  ci:
    desc: Run everything that must pass before work is handed over
    cmds:
      - task: check
      - task: test
      - task: build
